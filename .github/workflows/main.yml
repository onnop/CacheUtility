name: Deploy NuGet Package

# The only release route is a push to production (a merge from master). There is no tag
# trigger: the workflow creates the vX.Y.Z tag itself. Only onnop may release:
#  - the job only runs when onnop pushed (or re-ran) it,
#  - it runs in the "nuget" environment, which accepts only the production branch and
#    requires onnop's approval,
#  - NUGET_API_KEY is an environment secret of "nuget", so no other workflow or branch can read it,
#  - a repository ruleset lets only admins update production.
on:
  workflow_dispatch:  # Re-run a release by hand; still gated by the environment below.
  push:
    branches:
      - production

permissions:
  contents: write  # Needed so the "Tag release" step below can push a tag with the default token.

jobs:
  build-and-publish:
    if: github.actor == 'onnop' && github.ref == 'refs/heads/production'
    runs-on: windows-latest
    environment: nuget

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        # A red test must stop the release before anything reaches nuget.org.
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build -o ./nupkg

      - name: Push to NuGet
        shell: bash
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Tag release
        # The version is read from the csproj, so bumping it is a normal part of the change you
        # merge; this step turns "merged into production" into the vX.Y.Z release tag.
        shell: pwsh
        run: |
          $version = (Select-String -Path CacheUtility.csproj -Pattern '<Version>(.*?)</Version>').Matches[0].Groups[1].Value
          $tag = "v$version"

          if (git ls-remote --tags origin $tag) {
            Write-Host "Tag $tag already exists on origin - production was merged without a version bump, nothing to release."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Release $tag"
            git push origin $tag
          }
